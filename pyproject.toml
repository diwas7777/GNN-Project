[project]
name = "stgat-paper"
version = "0.1.0"
description = "Paper-faithful STGAT implementation for traffic flow forecasting"
requires-python = ">=3.10,<3.13"
dependencies = [
  "h5py",
  "numpy",
  "pyyaml",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.11",
  "mypy>=1",
  "pre-commit>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["stgat"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
