[project]
name = "stgat-paper"
version = "0.1.0"
description = "Paper-faithful STGAT implementation for traffic flow forecasting"
requires-python = ">=3.10,<3.13"
dependencies = [
  "h5py",
  "numpy",
  "pyyaml",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
