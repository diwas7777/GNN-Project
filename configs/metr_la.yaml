data:
  data_dir: data/METR-LA
  adjacency_path: data/METR-LA/adj_mx_dijsk.pkl
  adjacency_type: raw

model:
  num_nodes: 207
  input_features: 2
  input_steps: 12
  output_steps: 12
  hidden_channels: 64
  attention_heads: [4, 4, 4, 6]
  blocks: 4
  dropout: 0.6

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0
  grad_clip: 5.0
  null_value: 0.0
  cuda: true
  multi_gpu: true
  num_workers: 0
  checkpoint_path: checkpoints/metr_la_best.pt
