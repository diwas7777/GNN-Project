data:
  data_dir: data/PEMS-BAY
  adjacency_path: data/PEMS-BAY/adj_mx_bay.pkl
  adjacency_type: raw

model:
  num_nodes: 325
  input_features: 2
  input_steps: 12
  output_steps: 12
  hidden_channels: 64
  attention_heads: [4, 4, 4, 6]
  blocks: 4
  dropout: 0.6

training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0
  grad_clip: 5.0
  null_value: 0.0
  cuda: true
  multi_gpu: false
  amp: false
  amp_dtype: float16  # "float16" or "bfloat16" (bfloat16 for Ampere+ GPUs)
  accumulation_steps: 4
  num_workers: 0
  checkpoint_path: checkpoints/pems_bay_best.pt
  checkpoint_every: 20  # periodic checkpoint every N epochs (0 to disable)
  seed: 42  # random seed for reproducibility (null to skip)
  val_every_n_epochs: 1  # validate every N epochs (1 = every epoch)
  compile_model: false  # enable torch.compile() for PyTorch 2.0+ speedup
  early_stopping:
    patience: 25  # stop after N epochs without improvement (0 to disable)
    min_delta: 0.0  # minimum change to qualify as improvement
  scheduler:
    type: plateau  # "plateau" or "cosine"
    factor: 0.5
    patience: 10
    min_lr: 1.0e-6
